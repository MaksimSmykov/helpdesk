<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Список ваших заявок в IT-отдел со статусами и приоритетами." />
  <title>Мои заявки — IT Navigator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/pages.css" />
</head>
<body class="page-shell" data-page="tickets">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html" aria-label="IT Navigator — на главную">
        <span class="brand-mark" aria-hidden="true">IN</span>
        <span class="brand-text">IT Navigator</span>
      </a>
      <nav class="nav-desktop" aria-label="Основная навигация">
        <a class="nav-link" href="knowledge-base.html">База знаний</a>
        <a class="nav-link" href="missions.html">Навыки</a>
      </nav>
      <div class="header-actions">
        <a class="button button--primary" href="help.html">Нужна помощь</a>
        <button type="button" class="nav-toggle" aria-label="Меню" aria-expanded="false" aria-controls="navMobile">☰</button>
      </div>
    </div>
    <nav class="nav-mobile container" id="navMobile" aria-label="Мобильная навигация">
      <a href="knowledge-base.html">База знаний</a>
      <a href="missions.html">Навыки</a>
    </nav>
  </header>

  <main class="page-main">
    <div class="container page-stack">
      <header class="page-intro page-intro--split reveal">
        <div>
          <p class="block-kicker">Обращения</p>
          <h1>Мои заявки</h1>
          <p>Отслеживайте статус обращений и историю решений.</p>
        </div>
        <a class="button button--primary" href="create-ticket.html">Новая заявка</a>
      </header>

      <div class="filter-bar reveal reveal-delay-1">
        <input class="control" type="search" id="ticketSearch" placeholder="Поиск по номеру, теме или описанию" aria-label="Поиск заявок" />
        <select class="control" id="ticketStatusFilter" aria-label="Фильтр по статусу">
          <option value="">Все статусы</option>
          <option value="accepted">Принято</option>
          <option value="assigned">Назначен специалист</option>
          <option value="diagnostics">Диагностика</option>
          <option value="waiting">Ожидается действие</option>
          <option value="resolved">Решено</option>
        </select>
        <select class="control" id="ticketPriorityFilter" aria-label="Фильтр по приоритету">
          <option value="">Все приоритеты</option>
          <option value="low">Низкий</option>
          <option value="medium">Средний</option>
          <option value="high">Высокий</option>
          <option value="critical">Критический</option>
        </select>
      </div>

      <section class="ticket-table-block reveal reveal-delay-2" aria-label="Список заявок">
        <div id="ticketsList"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p style="max-width: 520px;">IT Navigator — кабинет сотрудника для решения IT-вопросов, заявок, базы знаний и цифровых навыков.</p>
      <nav class="footer-links" aria-label="Ссылки в подвале">
        <a href="help.html">Нужна помощь</a>
        <a href="knowledge-base.html">База знаний</a>
        <a href="missions.html">Навыки</a>
        <a href="profile.html">Профиль</a>
      </nav>
    </div>
  </footer>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <script src="../js/data.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/tickets.js"></script>
  <script src="../js/profile.js"></script>
  <script src="../js/diagnostics.js"></script>
  <script src="../js/missions.js"></script>
  <script src="../js/specular-button.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
